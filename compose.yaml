name: youtube-clone
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://youtube:${POSTGRES_PASSWORD:?Run scripts/deploy.sh}@db:5432/youtube
    FRONTEND_PATH: /app/frontend
    STORAGE_BACKEND: s3
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    S3_BUCKET: videos
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    minio:
      condition: service_healthy
  init: true
  security_opt:
    - no-new-privileges:true
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: youtube
      POSTGRES_USER: youtube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U youtube -d youtube']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: scripts/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - objects:/data
    healthcheck:
      test: [CMD, curl, --fail, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8000'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  worker:
    <<: *app
    command: python -m app.worker
    depends_on:
      app:
        condition: service_healthy
  seed:
    <<: *app
    profiles: [tools]
    command: python /app/scripts/seed.py
    depends_on:
      app:
        condition: service_healthy
    restart: 'no'
volumes:
  postgres:
  objects:
